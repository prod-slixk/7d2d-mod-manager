[package]
name = "mod-manager-7d2d"
version = "1.1.0"
description = "Mod manager for 7 Days to Die"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.20"
zip = { version = "2", default-features = false, features = ["deflate"] }
sevenz-rust2 = "0.13"
unrar = "0.5"
walkdir = "2"
regex = "1"
chrono = "0.4"
reqwest = { version = "0.12", features = ["blocking", "json"] }
keyring = { version = "3", features = ["windows-native"] }
winreg = "0.55"
sysinfo = "0.33"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
